# Prefer native Wayland for desktop toolkits under Lomiri, with X11
# (Xwayland) only as a fallback. Qt is already covered by the session's
# QT_QPA_PLATFORM=ubuntumirclient;wayland-egl;xcb and is left alone.
GDK_BACKEND=wayland,x11
SDL_VIDEODRIVER=wayland,x11
CLUTTER_BACKEND=wayland,x11
ELM_DISPLAY=wl
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
_JAVA_AWT_WM_NONREPARENTING=1
