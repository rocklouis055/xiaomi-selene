# selene: ofono binder plugin config (IRadio HIDL, MediaTek RIL).
#
# Without this file the plugin finds the IRadio instances but drops all of
# them ("Missing path for slot"), so no modem appears. Only slot1/slot2 are
# real modems; em*, se* and imsAospSlot* are engineering, secure-element
# and IMS instances, which the mtk extension (VoLTE, SMS over IMS) uses
# through the slots instead.
#
# radioInterface: the MediaTek RIL's IRadio 1.2 signal path is broken (it
# answers getSignalStrength with INVALID_RESPONSE and logs
# "currentSignalStrength_1_2: invalid response" instead of sending updates),
# so with the plugin's default 1.2 ofono has no signal strength and the
# indicator shows no network. 1.4 gets currentSignalStrength_1_4 updates.
# (1.5 does not detect the SIM. Right after a radio restart 1.4 shows
# "searching" for a while until the modem has re-attached.)
#
# deviceStateTracking: Lomiri's MCE has no getDisplayPowerState, so ofono
# cannot track the display; keep the RIL's reports on.

[Settings]
ExpectSlots=slot1,slot2
IgnoreSlots=em1,em2,se1,se2,imsAospSlot1,imsAospSlot2

[slot1]
path=/ril_0
extPlugin=mtk
radioInterface=1.4
deviceStateTracking=none

[slot2]
path=/ril_1
extPlugin=mtk
radioInterface=1.4
deviceStateTracking=none
