version = 1

# Everything written for this port
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 louise-patra <rocklouis055@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Android init scripts of the Halium system and vendor images, with changes
[[annotations]]
path = [
    "overlay/system/usr/share/halium-overlay/system/etc/init/camera_service.rc",
    "overlay/system/usr/share/halium-overlay/vendor/etc/init/vndservicemanager.rc",
]
precedence = "override"
SPDX-FileCopyrightText = ["The Android Open Source Project", "2026 louise-patra <rocklouis055@gmail.com>"]
SPDX-License-Identifier = "Apache-2.0"

# Patch to Xiaomi's MediaTek connectivity driver
[[annotations]]
path = "patches/connectivity/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 louise-patra <rocklouis055@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only"

# Remosaic shim by bellhopsw (https://github.com/bellhopsw/q25-50mp) and the library built from it
[[annotations]]
path = ["camera/remosaic-shim/**", "overlay/system/usr/share/halium-overlay/vendor/lib64/libremosaic_wrapper.so"]
precedence = "override"
SPDX-FileCopyrightText = "2026 bellhopsw"
SPDX-License-Identifier = "MIT"
