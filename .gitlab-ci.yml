# Shared GSI-port pipeline of the UBports community ports; build.sh adds the
# MediaTek connectivity modules between the kernel and the device tarball.
include:
  - https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools/-/raw/main/gsi-port-ci.yml

variables:
  ADAPTATION_TOOLS_USE_BUILD_WRAPPER: 1

# Licensing check (https://reuse.software)
reuse:
  stage: .pre
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint
